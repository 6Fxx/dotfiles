#### Configuration de tmux

###Prefix
# Garder Ctrl+b ET ajouter Ctrl+x comme second préfixe
set -g prefix C-b
set -g prefix2 C-a
bind C-b send-prefix
bind C-a send-prefix

### Sessions
# Numérotation des fenêtres à partir de 1
set -g base-index 1
# Renuméroter après fermeture d'une fenêtre
set -g renumber-windows on

### Windows
# Index des fenêtres commence à 1
setw -g base-index 1
# Renommage automatique selon la commande active
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"
# Empêche les applis de renommer les fenêtres
#setw -g allow-rename off

### Panes
# Index des panes commence à 1
set -g pane-base-index 1
# Durée d'affichage des numéros de pane (ms)
set -g display-panes-time 800
# Couleur des bordures inactives
set -g pane-border-style fg=colour238
# Couleur de la bordure active
set -g pane-active-border-style fg=colour51


### Souris
# Active le support souris complet
set -g mouse on

### Status bar
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
# Fond général : gris anthracite
set -g status-style bg=colour237,fg=colour250
# Gauche : nom de session
set -g status-left-length 30
set -g status-left "#[fg=colour234,bg=colour67,bold] #S #[fg=colour67,bg=colour237,nobold]"
# Droite : hostname | heure | date (TOUT sur une seule ligne)
set -g status-right-length 70
set -g status-right "#[fg=colour238,bg=colour237]#[fg=colour152,bg=colour238] #H #[fg=colour66,bg=colour238]#[fg=colour234,bg=colour66,bold] %H:%M #[fg=colour72,bg=colour66]#[fg=colour234,bg=colour72] %d/%m/%Y "
# Onglets fenêtres inactifs 
setw -g window-status-style fg=colour244,bg=colour237
setw -g window-status-format " #I:#W "
# Onglet actif
setw -g window-status-current-style fg=colour234,bg=colour67,bold
setw -g window-status-current-format " #I:#W "
# Bordures des panes
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour67
# Messages / commandes 
set -g message-style bg=colour67,fg=colour234,bold

### Raccourcis
# Rechargement à chaud de la config
bind r source-file ~/.tmux.conf \; display "✔ Config rechargée"
# Diviser les panes avec | et -  (plus intuitif)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# Navigation entre panes avec Alt+flèches (sans préfixe)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# Navigation entre fenêtres avec Shift+flèches
bind -n S-Left  previous-window
bind -n S-Right next-window
# Synchroniser les panes (utile pour taper sur plusieurs serveurs)
bind e setw synchronize-panes on
bind E setw synchronize-panes off
